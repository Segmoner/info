services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-free
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: Oracle12345
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/opt/oracle/scripts/startup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM dual;' | sqlplus -s system/Oracle12345@localhost:1521/FREEPDB1"
        ]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  oracle-data:
